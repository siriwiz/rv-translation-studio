<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">RV Translation Studio</title>
  <desc id="desc">Stay inside the story. A Windows workspace for screen translation.</desc>
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#252525" stroke-width=".7"/></pattern></defs>
  <rect width="1280" height="360" fill="#101010"/>
  <rect x="800" width="480" height="360" fill="url(#grid)"/>
  <path d="M845 360L1080 0M1020 360L1255 0" stroke="#333" stroke-width="1"/>
  <rect x="48" y="45" width="67" height="67" rx="15" fill="#eeede8"/>
  <text x="58" y="88" font-family="Arial, sans-serif" font-style="italic" font-size="30" font-weight="900" fill="#111">RV</text>
  <text x="137" y="71" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#eeede8">TRANSLATION STUDIO</text>
  <text x="137" y="96" font-family="monospace" font-size="11" letter-spacing="2" fill="#aaa">WINDOWS DESKTOP / LOCAL OCR / OPTIONAL CLOUD</text>
  <text x="48" y="195" font-family="Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#eeede8">Stay inside the story.</text>
  <text x="51" y="235" font-family="Arial, sans-serif" font-size="21" fill="#aaa">Capture the screen. Read in your language. Keep playing.</text>
  <path d="M50 280H1229" stroke="#444"/>
  <text x="51" y="314" font-family="monospace" font-size="12" letter-spacing="2" fill="#ddd">F1 CAPTURE + TRANSLATE</text>
  <text x="400" y="314" font-family="monospace" font-size="12" letter-spacing="2" fill="#ddd">F2 CLEAR OVERLAY</text>
  <text x="1219" y="314" text-anchor="end" font-family="monospace" font-size="12" letter-spacing="2" fill="#aaa">THE SCENE STAYS. THE WORDS CHANGE.</text>
</svg>
